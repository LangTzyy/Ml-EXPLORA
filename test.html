<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Tournament — EXPLORA</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold2: #FFA500;
    --blue: #00D4FF;
    --blue2: #0080FF;
    --red: #FF4444;
    --dark: #060B14;
    --dark2: #0D1520;
    --dark3: #111D2C;
    --panel: rgba(0,212,255,0.06);
    --border: rgba(0,212,255,0.18);
    --text: #C8D8E8;
    --win: #00FF88;
    --lose: #FF4444;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG animated grid */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index:0;
    pointer-events:none;
  }
  body::after {
    content:'';
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at 20% 50%, rgba(0,128,255,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255,215,0,0.05) 0%, transparent 50%);
    z-index:0;
    pointer-events:none;
  }

  /* HEADER */
  header {
    position: relative;
    z-index:10;
    text-align:center;
    padding: 40px 20px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(0,212,255,0.08) 0%, transparent 100%);
  }
  .logo-badge {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight:700;
    letter-spacing: 4px;
    color: var(--gold);
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.3);
    padding: 4px 14px;
    margin-bottom: 12px;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--blue) 0%, #fff 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    line-height:1.1;
    animation: shimmer 3s ease infinite;
  }
  @keyframes shimmer {
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  header h1 { background-size:200% 200%; }
  header p {
    font-family:'Inter', sans-serif;
    font-size:13px;
    color: rgba(200,216,232,0.5);
    letter-spacing:2px;
    margin-top:8px;
    text-transform:uppercase;
  }

  /* NAV TABS */
  nav {
    position:sticky; top:0; z-index:100;
    display:flex; justify-content:center; gap:4px;
    padding: 12px 20px;
    background: rgba(6,11,20,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    font-family:'Orbitron', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    padding: 10px 24px;
    border: 1px solid var(--border);
    background: transparent;
    color: rgba(200,216,232,0.5);
    cursor:pointer;
    transition: all 0.25s;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    position:relative;
    overflow:hidden;
  }
  .tab-btn::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, var(--blue2), var(--blue));
    opacity:0;
    transition: opacity 0.25s;
  }
  .tab-btn span { position:relative; z-index:1; }
  .tab-btn:hover { color:#fff; border-color: var(--blue); }
  .tab-btn:hover::before { opacity:0.15; }
  .tab-btn.active {
    color: var(--dark);
    border-color: var(--blue);
    background: var(--blue);
    text-shadow: none;
  }
  .tab-btn.active::before { opacity:0; }

  /* MAIN CONTENT */
  main {
    position:relative; z-index:1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  .tab-content { display:none; animation: fadeUp 0.3s ease; }
  .tab-content.active { display:block; }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(16px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* SECTION TITLE */
  .section-title {
    font-family:'Orbitron', monospace;
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    color: var(--blue);
    margin-bottom: 20px;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .section-title::after {
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(90deg, var(--blue), transparent);
  }

  /* PANEL */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 20px;
    position:relative;
    overflow:hidden;
  }
  .panel::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
  }
  .panel-title {
    font-family:'Orbitron', monospace;
    font-size:12px;
    letter-spacing:2px;
    color: var(--gold);
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title .icon { font-size:18px; }

  /* ===== GRUP STAGE ===== */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .group-panel { }
  .group-table { width:100%; border-collapse:collapse; font-size:13px; }
  .group-table th {
    font-family:'Orbitron', monospace;
    font-size:9px;
    letter-spacing:2px;
    color: rgba(200,216,232,0.4);
    padding: 6px 8px;
    text-align:left;
    border-bottom: 1px solid var(--border);
  }
  .group-table th:not(:first-child) { text-align:center; }
  .group-table td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(0,212,255,0.05);
    vertical-align:middle;
  }
  .group-table td:not(:first-child) { text-align:center; }
  .group-table tr:last-child td { border-bottom:none; }
  .group-table tr:hover td { background: rgba(0,212,255,0.04); }

  .team-cell {
    display:flex; align-items:center; gap:10px;
  }
  .team-avatar {
    width:28px; height:28px;
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:10px;
    color:#fff;
    flex-shrink:0;
    font-family:'Orbitron', monospace;
  }
  .rank-badge {
    width:20px; height:20px;
    border-radius:2px;
    display:inline-flex;
    align-items:center; justify-content:center;
    font-family:'Orbitron', monospace;
    font-size:10px;
    font-weight:700;
    margin-right:4px;
  }
  .rank-1 { background: rgba(255,215,0,0.2); color: var(--gold); border:1px solid rgba(255,215,0,0.4); }
  .rank-2 { background: rgba(192,192,192,0.2); color:#ccc; border:1px solid rgba(192,192,192,0.4); }
  .rank-3 { background: rgba(205,127,50,0.2); color:#cd7f32; border:1px solid rgba(205,127,50,0.4); }
  .rank-4 { background: transparent; color: rgba(200,216,232,0.4); }
  .pts { font-weight:700; color:#fff; }
  .advance { color: var(--win); font-size:11px; }
  .elim { color: var(--lose); font-size:11px; }
  .qualified-row td:first-child { border-left: 2px solid var(--win); }
  .highlight-top2 { background: rgba(0,255,136,0.03); }

  /* ===== BRACKET / PLAYOFF ===== */
  .bracket-wrap {
    overflow-x: auto;
    padding-bottom: 10px;
  }
  .bracket {
    display:flex;
    gap: 0;
    min-width: 800px;
    align-items:stretch;
  }
  .bracket-round {
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .round-label {
    font-family:'Orbitron', monospace;
    font-size:9px;
    letter-spacing:2px;
    color: rgba(200,216,232,0.4);
    text-align:center;
    padding-bottom:12px;
    border-bottom: 1px solid var(--border);
    margin-bottom:16px;
  }
  .round-matches {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    gap:8px;
    padding: 0 8px;
  }
  .match-card {
    background: var(--dark3);
    border: 1px solid var(--border);
    overflow:hidden;
    position:relative;
    transition: border-color 0.2s;
  }
  .match-card:hover { border-color: rgba(0,212,255,0.4); }
  .match-card::before {
    content:'';
    position:absolute;
    top:0; left:0; bottom:0; width:2px;
    background: var(--blue2);
    opacity:0.5;
  }
  .match-team {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 8px 10px;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .match-team + .match-team {
    border-top: 1px solid rgba(0,212,255,0.08);
  }
  .match-team.winner { color:#fff; }
  .match-team.loser { color: rgba(200,216,232,0.35); }
  .match-team.tbd { color: rgba(200,216,232,0.2); font-style:italic; }
  .match-score {
    font-family:'Orbitron', monospace;
    font-size:13px;
    font-weight:700;
    min-width:20px;
    text-align:center;
  }
  .match-score.win-score { color: var(--win); }
  .match-score.lose-score { color: rgba(200,216,232,0.35); }
  .match-score.pending { color: rgba(200,216,232,0.15); font-size:10px; }
  .match-id {
    font-family:'Orbitron', monospace;
    font-size:8px;
    letter-spacing:1px;
    color: rgba(200,216,232,0.2);
    padding: 3px 10px;
    background: rgba(0,0,0,0.2);
  }

  /* Champion */
  .champion-display {
    text-align:center;
    padding: 30px 20px;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,165,0,0.04));
    border: 1px solid rgba(255,215,0,0.25);
    position:relative;
    overflow:hidden;
  }
  .champion-display::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .champion-trophy { font-size:48px; margin-bottom:8px; display:block; }
  .champion-label {
    font-family:'Orbitron', monospace;
    font-size:10px;
    letter-spacing:3px;
    color: rgba(255,215,0,0.6);
    margin-bottom:8px;
  }
  .champion-name {
    font-family:'Orbitron', monospace;
    font-size:clamp(1.4rem, 4vw, 2.2rem);
    font-weight:900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
  }

  /* ===== JADWAL ===== */
  .schedule-list { display:flex; flex-direction:column; gap:10px; }
  .schedule-day-label {
    font-family:'Orbitron', monospace;
    font-size:10px;
    letter-spacing:3px;
    color: var(--gold);
    padding: 12px 0 6px;
    border-bottom: 1px solid rgba(255,215,0,0.15);
    margin-bottom:4px;
  }
  .schedule-item {
    display:grid;
    grid-template-columns: 80px 1fr auto;
    align-items:center;
    gap:16px;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    transition: all 0.2s;
    cursor:default;
  }
  .schedule-item:hover { border-color: rgba(0,212,255,0.3); background: rgba(0,212,255,0.08); }
  .schedule-item.completed { opacity:0.6; }
  .schedule-item.live {
    border-color: var(--red);
    background: rgba(255,68,68,0.06);
    animation: livePulse 2s ease infinite;
  }
  @keyframes livePulse {
    0%,100%{ box-shadow: 0 0 0 0 rgba(255,68,68,0); }
    50%{ box-shadow: 0 0 0 4px rgba(255,68,68,0.1); }
  }
  .schedule-time {
    font-family:'Orbitron', monospace;
    font-size:13px;
    font-weight:700;
    color: var(--blue);
  }
  .schedule-match {
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:14px;
  }
  .vs-badge {
    font-family:'Orbitron', monospace;
    font-size:9px;
    color: rgba(200,216,232,0.3);
    padding: 2px 6px;
    border: 1px solid var(--border);
  }
  .schedule-stage {
    font-size:10px;
    letter-spacing:1px;
    padding: 3px 10px;
    border-radius:2px;
    font-weight:600;
  }
  .stage-group { background: rgba(0,128,255,0.15); color: var(--blue2); border:1px solid rgba(0,128,255,0.3); }
  .stage-playoff { background: rgba(255,215,0,0.12); color: var(--gold); border:1px solid rgba(255,215,0,0.25); }
  .stage-live { background: rgba(255,68,68,0.15); color: var(--red); border:1px solid rgba(255,68,68,0.3); }
  .status-dot {
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    margin-right:5px;
    animation: blink 1s ease infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ===== LEADERBOARD ===== */
  .leaderboard-table {
    width:100%;
    border-collapse:collapse;
  }
  .leaderboard-table th {
    font-family:'Orbitron', monospace;
    font-size:9px;
    letter-spacing:2px;
    color: rgba(200,216,232,0.4);
    padding: 10px 14px;
    text-align:left;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .leaderboard-table th:not(:nth-child(2)) { text-align:center; }
  .leaderboard-table td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(0,212,255,0.05);
    font-size:13px;
    vertical-align:middle;
  }
  .leaderboard-table td:not(:nth-child(2)) { text-align:center; }
  .leaderboard-table tr:hover td { background: rgba(0,212,255,0.04); }
  .leaderboard-table tr.top1 td { background: rgba(255,215,0,0.05); }
  .leaderboard-table tr.top2 td { background: rgba(192,192,192,0.04); }
  .leaderboard-table tr.top3 td { background: rgba(205,127,50,0.04); }

  .rank-num {
    font-family:'Orbitron', monospace;
    font-weight:700;
    font-size:16px;
  }
  .rank-num.r1 { color: var(--gold); }
  .rank-num.r2 { color: #ccc; }
  .rank-num.r3 { color: #cd7f32; }
  .rank-num.other { color: rgba(200,216,232,0.3); font-size:13px; }

  .team-name-lb { font-weight:700; font-size:14px; letter-spacing:0.5px; }
  .team-group-badge {
    font-family:'Orbitron', monospace;
    font-size:8px;
    letter-spacing:1px;
    padding: 2px 6px;
    background: rgba(0,212,255,0.08);
    border: 1px solid var(--border);
    color: var(--blue);
    margin-left:8px;
  }

  .stat-val { font-weight:700; color:#fff; }
  .stat-val.pos { color: var(--win); }
  .stat-val.neg { color: var(--lose); }
  .stat-val.neutral { color: var(--blue); }

  .winrate-bar {
    width:70px;
    height:5px;
    background: rgba(255,255,255,0.08);
    border-radius:2px;
    overflow:hidden;
    display:inline-block;
    vertical-align:middle;
    margin-right:6px;
  }
  .winrate-fill {
    height:100%;
    border-radius:2px;
    background: linear-gradient(90deg, var(--blue2), var(--win));
  }

  .status-qualified { color: var(--win); font-size:11px; font-weight:600; }
  .status-eliminated { color: var(--lose); font-size:11px; }
  .status-pending { color: rgba(200,216,232,0.3); font-size:11px; }

  /* Responsive */
  @media(max-width:600px) {
    nav { flex-wrap:wrap; }
    .tab-btn { font-size:9px; padding:8px 14px; }
    .schedule-item { grid-template-columns: 65px 1fr; }
    .schedule-stage { display:none; }
    .groups-grid { grid-template-columns:1fr; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background: var(--dark2); }
  ::-webkit-scrollbar-thumb { background: var(--blue2); border-radius:2px; }
</style>
</head>
<body>

<header>
  <div class="logo-badge">MOBILE LEGENDS</div>
  <h1>EXPLORA 2026</h1>
  <p>Regional Invitational Tournament · 16 Teams · Surabaya</p>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('grup')"><span>GRUP</span></button>
  <button class="tab-btn" onclick="switchTab('playoff')"><span>PLAYOFF</span></button>
  <button class="tab-btn" onclick="switchTab('jadwal')"><span>JADWAL</span></button>
  <button class="tab-btn" onclick="switchTab('leaderboard')"><span>LEADERBOARD</span></button>
</nav>

<main>

  <!-- ===== TAB GRUP ===== -->
  <div id="tab-grup" class="tab-content active">
    <div class="section-title">FASE GRUP</div>

    <div class="groups-grid" id="groups-grid">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- ===== TAB PLAYOFF ===== -->
  <div id="tab-playoff" class="tab-content">
    <div class="section-title">BRACKET PLAYOFF</div>

    <div class="panel">
      <div class="panel-title"><span class="icon">🏆</span> ELIMINATION BRACKET</div>
      <div class="bracket-wrap">
        <div class="bracket" id="bracket-container">
          <!-- Generated by JS -->
        </div>
      </div>
    </div>

    <div id="champion-section" style="display:none;">
      <div class="champion-display">
        <span class="champion-trophy">🏆</span>
        <div class="champion-label">NEXUS CUP 2025 CHAMPION</div>
        <div class="champion-name" id="champion-name">—</div>
      </div>
    </div>
  </div>

  <!-- ===== TAB JADWAL ===== -->
  <div id="tab-jadwal" class="tab-content">
    <div class="section-title">JADWAL PERTANDINGAN</div>
    <div class="schedule-list" id="schedule-list">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- ===== TAB LEADERBOARD ===== -->
  <div id="tab-leaderboard" class="tab-content">
    <div class="section-title">LEADERBOARD KESELURUHAN</div>
    <div class="panel">
      <table class="leaderboard-table" id="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>TIM</th>
            <th>M</th>
            <th>W</th>
            <th>L</th>
            <th>WIN%</th>
            <th>+/-</th>
            <th>PTS</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
// ===================== DATA =====================
const TEAMS = [

  { id:16, name:"ZENITH RISE",   short:"ZNT", color:"#FF69B4", group:"D" },
];

// Group results: [team1_id, team2_id, score1, score2]
const GROUP_MATCHES = [
  // Group A
  [1,2, 2,1], [3,4, 2,0], [1,3, 2,0], [2,4, 2,1], [1,4, 2,0], [2,3, 1,2],
  // Group B
  [5,6, 1,2], [7,8, 0,2], [5,7, 2,1], [6,8, 2,1], [5,8, 2,0], [6,7, 2,1],
  // Group C

// ===================== UTILS =====================
function getTeam(id) { return TEAMS.find(t=>t.id===id); }

function computeGroupStandings() {
  const stats = {};
  TEAMS.forEach(t => {
    stats[t.id] = { id:t.id, name:t.name, short:t.short, color:t.color, group:t.group, w:0, l:0, pts:0, gw:0, gl:0 };
  });
  GROUP_MATCHES.forEach(([t1,t2,s1,s2]) => {
    const w = s1>s2 ? t1 : t2;
    const l = s1>s2 ? t2 : t1;
    stats[w].w++; stats[w].pts+=3; stats[w].gw+=Math.max(s1,s2); stats[w].gl+=Math.min(s1,s2);
    stats[l].l++; stats[l].gw+=Math.min(s1,s2); stats[l].gl+=Math.max(s1,s2);
  });
  const groups = { A:[], B:[], C:[], D:[] };
  Object.values(stats).forEach(s => groups[s.group].push(s));
  Object.keys(groups).forEach(g => {
    groups[g].sort((a,b) => b.pts - a.pts || (b.gw-b.gl)-(a.gw-a.gl));
  });
  return groups;
}

function renderTeamRow(teamName, score, oppScore, oppScore2, done, isFirst) {
  if (!teamName) {
    return `<div class="match-team tbd"><span>TBD</span><span class="match-score pending">—</span></div>`;
  }
  const isWinner = done && score > oppScore;
  const cls = done ? (isWinner ? 'winner' : 'loser') : '';
  const scoreCls = done ? (isWinner ? 'win-score' : 'lose-score') : 'pending';
  const team = TEAMS.find(t => t.name === teamName);
  const color = team ? team.color : '#888';
  const short = team ? team.short : teamName.slice(0,3);

  return `
    <div class="match-team ${cls}">
      <div style="display:flex;align-items:center;gap:8px;flex:1">
        <div class="team-avatar" style="background:${color}22;border:1px solid ${color}44;color:${color};width:22px;height:22px;font-size:8px">${short}</div>
        <span style="font-size:12px;font-weight:600;letter-spacing:0.5px">${teamName}</span>
      </div>
      <span class="match-score ${scoreCls}">${done ? score : '—'}</span>
    </div>`;
}

      const el = document.createElement('div');
      el.className = `schedule-item${item.status==='done'?' completed':''}${item.status==='live'?' live':''}`;

      const stageClass = item.status==='live' ? 'stage-live' : (item.stage==='playoff' ? 'stage-playoff' : 'stage-group');

// ===================== RENDER LEADERBOARD =====================
function renderLeaderboard() {
  const groups = computeGroupStandings();
  let all = [];
  Object.values(groups).forEach(g => g.forEach(t => all.push(t)));

  // Add playoff advancement info
  const playoffTeams = ['RYZEN ESPORT','NOVA STRIKE','STORM KINGS','APEX UNITY','SOLAR FLARE','CYBER KNIGHTS','TITAN ROAR','ECHO STRIKERS'];

  all.sort((a,b) => b.pts - a.pts || (b.w-b.l)-(a.w-a.l));

  const tbody = document.getElementById('leaderboard-body');
  const rowClasses = ['top1','top2','top3','',''];

  tbody.innerHTML = all.map((t, i) => {
    const rank = i+1;
    const rankCls = rank===1?'r1':rank===2?'r2':rank===3?'r3':'other';
    const rankDisp = rank<=3 ? ['🥇','🥈','🥉'][rank-1] : rank;
    const m = t.w+t.l;
    const wr = m>0 ? Math.round(t.w/m*100) : 0;
    const gd = t.gw-t.gl;
    const inPlayoff = playoffTeams.includes(t.name);
    const isFinal = t.name === "RYZEN ESPORT";
    const statusHtml = isFinal
      ? `<span style="color:var(--gold);font-weight:700;font-size:12px">🏆 JUARA</span>`
      : (inPlayoff ? `<span class="status-qualified">✓ PLAYOFF</span>` : `<span class="status-eliminated">GUGUR</span>`);

    return `
      <tr class="${rowClasses[i]||''}">
        <td><span class="rank-num ${rankCls}">${rankDisp}</span></td>
        <td>
          <div class="team-cell">
            <div class="team-avatar" style="background:${t.color}22;border:1px solid ${t.color}44;color:${t.color}">${t.short}</div>
            <div>
              <span class="team-name-lb">${t.name}</span>
              <span class="team-group-badge">GRP ${t.group}</span>
            </div>
          </div>
        </td>
        <td><span class="stat-val">${m}</span></td>
        <td><span class="stat-val pos">${t.w}</span></td>
        <td><span class="stat-val neg">${t.l}</span></td>
        <td>
          <div class="winrate-bar"><div class="winrate-fill" style="width:${wr}%"></div></div>
          <span class="stat-val">${wr}%</span>
        </td>
        <td><span class="stat-val ${gd>=0?'pos':'neg'}">${gd>=0?'+':''}${gd}</span></td>
        <td><span class="stat-val neutral" style="font-family:'Orbitron',monospace;font-size:15px">${t.pts}</span></td>
        <td>${statusHtml}</td>
      </tr>`;
  }).join('');
}
